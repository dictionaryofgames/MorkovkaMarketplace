{% extends 'base.html' %}

{% block title %}Пополнение баланса — Маркетплейс{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4"><i class="bi bi-wallet2"></i> Пополнение баланса</h2>

        <div class="card shadow mb-4">
            <div class="card-body text-center p-4">
                <p class="text-muted mb-2">Текущий баланс</p>
                <h1 class="text-primary">{{ user.balance|floatformat:2 }} ₽</h1>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}

                    <h5 class="mb-3">Выберите сумму</h5>

                    <div class="row g-2 mb-3">
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-primary w-100 btn-amount" data-amount="100">100 ₽</button>
                        </div>
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-primary w-100 btn-amount" data-amount="500">500 ₽</button>
                        </div>
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-primary w-100 btn-amount" data-amount="1000">1000 ₽</button>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-primary w-100 btn-amount" data-amount="2000">2000 ₽</button>
                        </div>
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-primary w-100 btn-amount" data-amount="5000">5000 ₽</button>
                        </div>
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-primary w-100 btn-amount" data-amount="10000">10000 ₽</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label">Или введите свою сумму</label>
                        <input type="number" name="amount" id="amount" class="form-control form-control-lg"
                               placeholder="Введите сумму" min="1" max="100000" step="0.01">
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100">
                        <i class="bi bi-plus-circle"></i> Пополнить
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.querySelectorAll('.btn-amount').forEach(btn => {
    btn.addEventListener('click', function() {
        document.getElementById('amount').value = this.dataset.amount;
        document.querySelectorAll('.btn-amount').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
    });
});
</script>
{% endblock %}
