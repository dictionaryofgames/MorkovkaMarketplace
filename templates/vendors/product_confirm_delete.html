{% extends 'base.html' %}

{% block title %}Удаление товара — Маркетплейс{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
                <h3 class="mt-3">Удалить товар?</h3>
                <p class="text-muted">Вы уверены, что хотите удалить «{{ product.name }}»? Это действие нельзя отменить.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg">
                        <i class="bi bi-trash"></i> Удалить
                    </button>
                    <a href="{% url 'vendors:product_list' %}" class="btn btn-secondary btn-lg">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
